name: Check Kick Live Status

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  check-kick:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Kick status
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          url = 'https://kick.com/sensei_fr'
          headers = {'User-Agent': 'Mozilla/5.0'}
          req = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
          except Exception:
              html = ''

          live = False
          lowered = html.lower()

          if 'live' in lowered or 'streaming' in lowered or 'is live' in lowered:
              live = True

          status = {'live': live, 'checkedAt': __import__('datetime').datetime.utcnow().replace(microsecond=0).isoformat() + 'Z'}

          with open('status.json', 'w', encoding='utf-8') as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit status.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No changes to status.json"
          else
            git commit -m "Update Kick status"
            git push
          fi
