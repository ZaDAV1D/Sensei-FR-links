name: Check Kick Live Status

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  check-kick:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kick status
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = "https://kick.com/api/v2/channels/sensei_fr/livestream"

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          live = False

          try:
              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.loads(response.read().decode("utf-8"))

              if data.get("data"):
                  live = True

          except Exception as e:
              print("Kick error:", e)

          status = {
              "live": live,
              "checkedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          }

          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, indent=2)
              f.write("\n")
          PY

      - name: Commit status.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Kick status"
            git push
          fi
