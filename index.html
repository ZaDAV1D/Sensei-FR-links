<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensei FR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:"Space Grotesk",sans-serif;
background:#040404;
overflow:hidden;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
body:before{
content:"";
position:fixed;inset:-20%;
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.10),transparent 30%),
radial-gradient(circle at 80% 70%,rgba(255,255,255,.06),transparent 35%),
radial-gradient(circle at 50% 50%,rgba(90,90,90,.15),transparent 40%);
filter:blur(40px);
animation:bg 12s ease-in-out infinite alternate;
}
@keyframes bg{
to{transform:scale(1.15) rotate(8deg)}
}
canvas{position:fixed;inset:0}
.card{
position:relative;
z-index:2;
width:min(540px,92vw);
padding:38px;
border-radius:32px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(35px);
border:1px solid rgba(255,255,255,.12);
box-shadow:0 20px 80px rgba(0,0,0,.6),0 0 40px rgba(255,255,255,.05);
animation:fade .8s;
transition:.15s;
transform-style:preserve-3d;
}
@keyframes fade{
from{opacity:0;transform:translateY(40px) scale(.95)}
to{opacity:1;transform:none}
}
.avatar{
width:140px;height:140px;margin:auto;
padding:5px;
border-radius:50%;
background:conic-gradient(#fff,#555,#fff);
animation:spin 10s linear infinite;
box-shadow:0 0 45px rgba(255,255,255,.18);
}
.avatar img{width:100%;height:100%;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
h1{
margin:18px 0 6px;
font-size:44px;
text-align:center;
background:linear-gradient(90deg,#fff,#8f8f8f,#fff);
-webkit-background-clip:text;
color:transparent;
}
p{text-align:center;opacity:.65;margin-bottom:24px}
.link{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
height:58px;
margin:10px 0;
border-radius:18px;
text-decoration:none;
color:#fff;
font-weight:700;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
transition:.28s;
position:relative;
overflow:hidden;
}
.link:before{
content:"";
position:absolute;
left:-120%;
top:0;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
transition:.6s;
}
.link:hover:before{left:120%}
.link:hover{
transform:translateY(-4px) scale(1.02);
box-shadow:0 0 28px rgba(255,255,255,.15);
border-color:rgba(255,255,255,.3);
}
.gold{
background:linear-gradient(135deg,rgba(255,200,0,.18),rgba(255,255,255,.05));
border-color:rgba(255,200,0,.4)
}

#loader{
position:fixed;
inset:0;
background:#050505;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
transition:opacity .8s ease,visibility .8s ease;
}
#loader.hide{
opacity:0;
visibility:hidden;
}
.loader-logo{
width:170px;
border-radius:50%;
filter:drop-shadow(0 0 30px rgba(255,255,255,.7));
animation:logoPop 1.2s ease infinite alternate;
}
.loader-ring{
position:absolute;
width:210px;
height:210px;
border-radius:50%;
border:3px solid rgba(255,255,255,.12);
border-top-color:#fff;
animation:spinRing 1.3s linear infinite;
}
@keyframes spinRing{
to{transform:rotate(360deg);}
}
@keyframes logoPop{
from{transform:scale(.95);}
to{transform:scale(1.05);}
}

</style>
</head>
<body>

<div id="loader">
    <div class="loader-ring"></div>
    <img src="logo.png" class="loader-logo">
</div>

<canvas id="c"></canvas>

<div class="card" id="card">
<div class="avatar"><img src="logo.png"></div>
<h1>Sensei FR</h1>
<p>Creator • Streams • Community </p>

<a class="link" href="https://www.youtube.com/@senseifrfr" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i>YouTube Main</a>

<a class="link" href="https://www.youtube.com/@senseifr-livestream" target="_blank" rel="noopener noreferrer"><i class="fas fa-video"></i>Clips Channel</a>

<a class="link" href="https://kick.com/sensei_fr" target="_blank" rel="noopener noreferrer"><i class="fas fa-bolt"></i>Kick</a>

<a class="link" href="https://www.instagram.com/yairfr12/" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i>Instagram</a>

<a class="link" href="https://discord.com/invite/Eqx7858MVn" target="_blank" rel="noopener noreferrer"><i class="fab fa-discord"></i>Discord</a>

<a class="link" href="https://www.tiktok.com/@sense1_fr" target="_blank" rel="noopener noreferrer"><i class="fab fa-tiktok"></i>TikTok</a>

<a class="link" href="https://streamelements.com/sense1_fr/tip" target="_blank" rel="noopener noreferrer"><i class="fab fa-paypal"></i>Tip Sensei</a>

<a class="link gold" href="https://s-computers.com/" target="_blank" rel="noopener noreferrer"><i class="fas fa-star"></i>S מחשבים • Code SENSEI</a>
</div>

<script>
const card = document.getElementById("card");

document.addEventListener("mousemove", e => {
    const x = (e.clientX / window.innerWidth - .5) * 12;
    const y = (e.clientY / window.innerHeight - .5) * -12;
    card.style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
});

const c = document.getElementById("c"),
      ctx = c.getContext("2d");

let w, h, p = [];

function resize() {
    w = c.width = innerWidth;
    h = c.height = innerHeight;
    p = [...Array(90)].map(() => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - .5) * .5,
        vy: (Math.random() - .5) * .5
    }));
}

resize();
onresize = resize;

(function loop() {
    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < p.length; i++) {
        let a = p[i];
        a.x += a.vx;
        a.y += a.vy;

        if (a.x < 0 || a.x > w) a.vx *= -1;
        if (a.y < 0 || a.y > h) a.vy *= -1;

        ctx.fillStyle = "#fff";
        ctx.fillRect(a.x, a.y, 2, 2);

        for (let j = i + 1; j < p.length; j++) {
            let b = p[j];
            let d = Math.hypot(a.x - b.x, a.y - b.y);

            if (d < 110) {
                ctx.strokeStyle = "rgba(255,255,255," + (1 - d / 110) * 0.15 + ")";
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            }
        }
    }

    requestAnimationFrame(loop);
})();

window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loader").classList.add("hide");
    }, 1800);

    // Open all links in a new tab
    document.querySelectorAll("a").forEach(link => {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
    });
});
</script>

</script>
</body>
</html>
